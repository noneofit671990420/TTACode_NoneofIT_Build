# Build the TTACode Windows launchers and attach them to a GitHub Release.
#
# Two launchers, built here on windows-latest — never cross-compiled
# from Linux:
#   dist/ttacode.exe      the desktop chat GUI (windowed, average users)
#   dist/ttacode-cli.exe  the headless harness CLI (console, power users)
# Triggers: pushing a tag like v0.3.0, or manually via "Run workflow".
# The release is created if the tag has none; otherwise the exes are
# uploaded to the existing release.

name: Build Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gui:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ttacode.exe (desktop GUI)
        shell: powershell
        run: .\build\build-gui.ps1

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ttacode.exe
          generate_release_notes: true

  build-cli:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ttacode-cli.exe (headless CLI)
        shell: powershell
        run: .\build\build-exe.ps1

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ttacode-cli.exe
          generate_release_notes: true
